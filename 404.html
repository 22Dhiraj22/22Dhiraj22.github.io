<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dhiraj More — Product Manager</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232f5bea'/><text x='50%' y='54%' text-anchor='middle' dominant-baseline='middle' font-family='Arial' font-weight='700' font-size='28' fill='white'>DM</text></svg>">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Broken links (often from chat apps adding a trailing "." or ")" or dropping ".html") land here:
    // tidy the path and go there, or fall back to the home page.
    (function () {
      var p = location.pathname, clean = p.replace(/[.,;:!?)\]'"]+$/, "").replace(/%20.*$/, "");
      if (/^\/work\/[\w-]+$/.test(clean)) clean += ".html";
      location.replace(clean !== p ? clean : "/");
    })();
  </script>
</head>
<body>
  <main class="wrap" style="padding:96px 0;text-align:center">
    <p>Taking you to the portfolio…</p>
    <p><a href="/" class="btn primary">Go to the home page →</a></p>
  </main>
</body>
</html>
